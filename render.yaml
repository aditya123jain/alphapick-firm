# Render Blueprint: free static site (no server, never sleeps).
services:
  - type: web
    runtime: static
    name: alphapick-firm
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # No catch-all rewrite: Render serves out/404.html for unknown paths.
    domains:
      - alphapick.in
      - www.alphapick.in
